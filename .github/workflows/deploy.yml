name: Deploy to Amazon ECR & ECS

on:
  push:
    branches:
      - master

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-south-1
  ROLE_TO_ASSUME: arn:aws:iam::833291393451:role/GitHubActions-CentralMemory-Deploy
  ECR_REPOSITORY: central-memory-server

jobs:
  build-and-push:
    name: Build & Push Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Server Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./deploy/Dockerfile.server
          push: true
          build-args: |
            VERSION=${{ github.sha }}
            COMMIT=${{ github.sha }}
            BUILT_AT=${{ github.event.head_commit.timestamp }}
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trigger ECS deployment with updated secrets and env
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: bash deploy/deploy-ecs.sh

  deploy-frontend:
    name: Build & Deploy PWA
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install & build
        working-directory: frontend
        env:
          VITE_APP_VERSION: ${{ github.sha }}
        run: |
          npm ci
          npm run build

      - name: Upload PWA artifact
        uses: actions/upload-artifact@v4
        with:
          name: nexus-pwa-${{ github.sha }}
          path: frontend/dist
          retention-days: 14

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy to S3 & CloudFront
        env:
          AWS_REGION: ${{ env.AWS_REGION }}
          FRONTEND_S3_BUCKET: ${{ vars.FRONTEND_S3_BUCKET }}
          FRONTEND_CLOUDFRONT_ID: ${{ vars.FRONTEND_CLOUDFRONT_ID }}
          FRONTEND_LIVE_S3_BUCKET: ${{ vars.FRONTEND_LIVE_S3_BUCKET }}
        run: bash deploy/deploy-frontend.sh

  # Production API host (Lightsail). Skipped until LIGHTSAIL_SSH_KEY is set —
  # see deploy/README.md "GitHub Actions secrets".
  deploy-lightsail:
    name: Deploy Lightsail API
    runs-on: ubuntu-latest
    if: ${{ vars.DEPLOY_LIGHTSAIL == 'true' }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install SSH key
        env:
          LIGHTSAIL_SSH_KEY: ${{ secrets.LIGHTSAIL_SSH_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${LIGHTSAIL_SSH_KEY}" ]; then
            echo "LIGHTSAIL_SSH_KEY secret is empty; set it in repo Settings → Secrets"
            exit 1
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$LIGHTSAIL_SSH_KEY" > ~/.ssh/central-memory-key.pem
          chmod 600 ~/.ssh/central-memory-key.pem

      - name: Deploy to Lightsail
        env:
          LIGHTSAIL_HOST: ${{ secrets.LIGHTSAIL_HOST }}
          LIGHTSAIL_USER: ${{ secrets.LIGHTSAIL_USER }}
        run: |
          set -euo pipefail
          export LIGHTSAIL_KEY="$HOME/.ssh/central-memory-key.pem"
          export LIGHTSAIL_HOST="${LIGHTSAIL_HOST:-13.205.221.207}"
          export LIGHTSAIL_USER="${LIGHTSAIL_USER:-ubuntu}"
          bash deploy/deploy-lightsail.sh
