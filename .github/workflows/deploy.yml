name: Deploy to Amazon ECR & ECS

on:
  push:
    branches:
      - master

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-south-1
  ROLE_TO_ASSUME: arn:aws:iam::833291393451:role/GitHubActions-CentralMemory-Deploy
  ECR_REPOSITORY: central-memory-server

jobs:
  build-and-push:
    name: Build & Push Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Server Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./deploy/Dockerfile.server
          push: true
          build-args: |
            VERSION=${{ github.sha }}
            COMMIT=${{ github.sha }}
            BUILT_AT=${{ github.event.head_commit.timestamp }}
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trigger ECS deployment with updated secrets and env
        run: |
          echo "Ensuring task execution role can read central-memory/github secret..."
          aws iam put-role-policy --role-name central-memory-task-exec \
            --policy-name central-memory-read-github-secret \
            --policy-document '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":"secretsmanager:GetSecretValue","Resource":"arn:aws:secretsmanager:${{ env.AWS_REGION }}:833291393451:secret:central-memory/github*"}]}' 2>/dev/null || true

          echo "Resolving active task definition family..."
          TASK_DEF_FAMILY="central-memory-server"
          if ! aws ecs describe-task-definition --task-definition "$TASK_DEF_FAMILY" &>/dev/null; then
            TASK_DEF_FAMILY="central-memory-srv"
          fi
          echo "Using family: $TASK_DEF_FAMILY"

          IMAGE="${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}"

          aws ecs describe-task-definition --task-definition "$TASK_DEF_FAMILY" \
            | jq '.taskDefinition | del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy)' \
            > /tmp/task-def.json

          node -e '
          const fs = require("fs");
          const def = JSON.parse(fs.readFileSync("/tmp/task-def.json", "utf8"));
          const container = def.containerDefinitions[0];
          container.image = "'"$IMAGE"'";

          function setEnv(name, value) {
            if (!container.environment) container.environment = [];
            const idx = container.environment.findIndex(e => e.name === name);
            if (idx >= 0) container.environment[idx].value = value;
            else container.environment.push({ name, value });
          }

          function setSecret(name, valueFrom) {
            if (!container.secrets) container.secrets = [];
            const idx = container.secrets.findIndex(s => s.name === name);
            if (idx >= 0) container.secrets[idx].valueFrom = valueFrom;
            else container.secrets.push({ name, valueFrom });
          }

          setEnv("PUBLIC_API_URL", "https://api-nexus.pratyushes.dev");
          setEnv("PUBLIC_APP_URL", "https://nexus.pratyushes.dev");
          setEnv("GITHUB_OAUTH_REDIRECT", "https://api-nexus.pratyushes.dev/auth/github/callback");
          setEnv("GITHUB_CLIENT_ID", "Ov23li997FyAUgaucZQO");
          setSecret("GITHUB_CLIENT_SECRET", "arn:aws:secretsmanager:${{ env.AWS_REGION }}:833291393451:secret:central-memory/github:client_secret::");

          fs.writeFileSync("/tmp/task-def.json", JSON.stringify(def, null, 2));
          '

          echo "Registering updated ECS task definition revision..."
          REGISTERED_ARN=$(aws ecs register-task-definition --cli-input-json file:///tmp/task-def.json --query 'taskDefinition.taskDefinitionArn' --output text)
          echo "Registered new task definition: $REGISTERED_ARN"

          echo "Updating ECS service with new task definition..."
          aws ecs update-service --cluster central-memory-cluster --service central-memory-srv --task-definition "$REGISTERED_ARN" --force-new-deployment || \
          aws ecs update-service --cluster central-memory-cluster --service central-memory-server --task-definition "$REGISTERED_ARN" --force-new-deployment || \
          aws ecs update-service --cluster central-memory --service central-memory-srv --task-definition "$REGISTERED_ARN" --force-new-deployment || \
          aws ecs update-service --cluster central-memory --service central-memory-server --task-definition "$REGISTERED_ARN" --force-new-deployment

  deploy-frontend:
    name: Build & Deploy PWA
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install & build
        working-directory: frontend
        env:
          VITE_APP_VERSION: ${{ github.sha }}
        run: |
          npm ci
          npm run build

      - name: Upload PWA artifact
        uses: actions/upload-artifact@v4
        with:
          name: nexus-pwa-${{ github.sha }}
          path: frontend/dist
          retention-days: 14

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy to S3 & configure website
        env:
          DISTRIBUTION: ${{ vars.FRONTEND_CLOUDFRONT_ID }}
        run: |
          BUCKET="${{ vars.FRONTEND_S3_BUCKET }}"
          if [ -z "$BUCKET" ]; then
            BUCKET="nexus-frontend-833291393451"
          fi
          echo "Target S3 bucket: $BUCKET"

          # Create bucket if not exists
          if ! aws s3api head-bucket --bucket "$BUCKET" 2>/dev/null; then
            echo "Creating bucket $BUCKET..."
            aws s3api create-bucket --bucket "$BUCKET" --region ${{ env.AWS_REGION }} \
              --create-bucket-configuration LocationConstraint=${{ env.AWS_REGION }} || true
          fi

          # Allow public read for static website hosting (for Cloudflare CNAME proxy)
          aws s3api put-public-access-block --bucket "$BUCKET" \
            --public-access-block-configuration "BlockPublicAcls=false,IgnorePublicAcls=false,BlockPublicPolicy=false,RestrictPublicBuckets=false" || true

          aws s3 website "s3://${BUCKET}" --index-document index.html --error-document index.html || true

          # Set bucket policy for public read
          cat <<POLICY > /tmp/bucket-policy.json
          {
            "Version": "2012-10-17",
            "Statement": [
              {
                "Sid": "PublicReadGetObject",
                "Effect": "Allow",
                "Principal": "*",
                "Action": "s3:GetObject",
                "Resource": "arn:aws:s3:::${BUCKET}/*"
              }
            ]
          }
          POLICY
          aws s3api put-bucket-policy --bucket "$BUCKET" --policy file:///tmp/bucket-policy.json || true

          # Sync static assets
          aws s3 sync frontend/dist "s3://${BUCKET}" --delete \
            --cache-control "public,max-age=31536000,immutable" \
            --exclude "index.html" --exclude "sw.js" --exclude "manifest.webmanifest"

          aws s3 cp frontend/dist/index.html "s3://${BUCKET}/index.html" \
            --cache-control "public,max-age=60" --content-type "text/html"

          aws s3 cp frontend/dist/sw.js "s3://${BUCKET}/sw.js" \
            --cache-control "public,max-age=60" --content-type "application/javascript"

          aws s3 cp frontend/dist/manifest.webmanifest "s3://${BUCKET}/manifest.webmanifest" \
            --cache-control "public,max-age=60" --content-type "application/manifest+json"

          # CloudFront Distribution Management
          DIST_ID="${{ vars.FRONTEND_CLOUDFRONT_ID }}"
          if [ -z "$DIST_ID" ]; then
            echo "Checking existing CloudFront distributions for origin $BUCKET..."
            DIST_ID=$(aws cloudfront list-distributions --query "DistributionList.Items[?contains(Origins.Items[0].DomainName, '$BUCKET')].Id" --output text 2>/dev/null || true)
          fi

          CF_DOMAIN=""
          if [ -z "$DIST_ID" ] || [ "$DIST_ID" = "None" ]; then
            echo "Creating CloudFront distribution for $BUCKET with SPA routing..."
            cat <<'EOF' > /tmp/cf-config.json
{
  "CallerReference": "nexus-frontend-init",
  "Comment": "Nexus React PWA Frontend",
  "Enabled": true,
  "DefaultRootObject": "index.html",
  "Origins": {
    "Quantity": 1,
    "Items": [
      {
        "Id": "S3-nexus-frontend",
        "DomainName": "BUCKET_NAME.s3-website.REGION_NAME.amazonaws.com",
        "CustomOriginConfig": {
          "HTTPPort": 80,
          "HTTPSPort": 443,
          "OriginProtocolPolicy": "http-only"
        }
      }
    ]
  },
  "DefaultCacheBehavior": {
    "TargetOriginId": "S3-nexus-frontend",
    "ViewerProtocolPolicy": "redirect-to-https",
    "AllowedMethods": {
      "Quantity": 2,
      "Items": ["GET", "HEAD"]
    },
    "ForwardedValues": {
      "QueryString": false,
      "Cookies": { "Forward": "none" }
    },
    "MinTTL": 0,
    "DefaultTTL": 86400,
    "MaxTTL": 31536000
  },
  "CustomErrorResponses": {
    "Quantity": 1,
    "Items": [
      {
        "ErrorCode": 404,
        "ResponsePagePath": "/index.html",
        "ResponseCode": "200",
        "ErrorCachingMinTTL": 0
      }
    ]
  }
}
EOF
            sed -i "s/BUCKET_NAME/$BUCKET/g" /tmp/cf-config.json
            sed -i "s/REGION_NAME/${{ env.AWS_REGION }}/g" /tmp/cf-config.json
            DIST_RES=$(aws cloudfront create-distribution --distribution-config file:///tmp/cf-config.json 2>/dev/null || true)
            DIST_ID=$(echo "$DIST_RES" | grep -o '"Id": "[^"]*"' | head -1 | cut -d'"' -f4 || true)
            CF_DOMAIN=$(echo "$DIST_RES" | grep -o '"DomainName": "[^"]*"' | head -1 | cut -d'"' -f4 || true)
          else
            CF_DOMAIN=$(aws cloudfront get-distribution --id "$DIST_ID" --query "Distribution.DomainName" --output text 2>/dev/null || true)
            echo "Found CloudFront distribution: $DIST_ID ($CF_DOMAIN)"
            echo "Creating CloudFront cache invalidation..."
            aws cloudfront create-invalidation --distribution-id "$DIST_ID" --paths "/*" || true
          fi

          echo "=========================================================="
          echo "S3 Bucket: $BUCKET"
          echo "S3 Website Endpoint: http://${BUCKET}.s3-website.${{ env.AWS_REGION }}.amazonaws.com"
          if [ -n "$CF_DOMAIN" ]; then
            echo "CloudFront Distribution: $DIST_ID"
            echo "CloudFront Domain: https://$CF_DOMAIN"
            echo "Cloudflare CNAME Target: $CF_DOMAIN"
          fi
          echo "=========================================================="
