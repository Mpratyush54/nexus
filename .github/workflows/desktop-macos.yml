name: desktop-macos

# Nexus for macOS, phase 1: the WinUI sources in desktop/windows built as an
# Uno Platform Skia desktop app (desktop/uno), bundled as an ad-hoc signed
# Nexus.app with the universal Go core, launched on the runner and
# screenshotted. Build and evidence only: nothing here signs for
# distribution, notarizes, publishes or deploys.

on:
  push:
    branches-ignore: [master, main]
    paths:
      - 'desktop/**'
      - 'bindings/**'
      - 'cmd/nexuscore/**'
      - 'internal/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/desktop-macos.yml'
  workflow_dispatch:

concurrency:
  group: desktop-macos-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  mac-app:
    name: Nexus.app (Uno Skia, osx-arm64)
    runs-on: macos-15
    timeout-minutes: 45
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      APP: ${{ github.workspace }}/dist/Nexus.app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Machine facts
        run: |
          sw_vers; uname -m
          dotnet --info | head -20
          system_profiler SPDisplaysDataType | sed -n 1,25p || true

      # Same build as macos.yml's dylib step.
      - name: Build libnexuscore.dylib (arm64 + x86_64, universal)
        run: |
          set -euo pipefail
          mkdir -p dist
          CGO_ENABLED=1 GOARCH=arm64 CC="clang -arch arm64" \
            go build -tags nexuscorelib -trimpath -buildmode=c-shared -o dist/arm64/libnexuscore.dylib ./cmd/nexuscore
          CGO_ENABLED=1 GOARCH=amd64 CC="clang -arch x86_64" \
            go build -tags nexuscorelib -trimpath -buildmode=c-shared -o dist/amd64/libnexuscore.dylib ./cmd/nexuscore
          lipo -create -output dist/libnexuscore.dylib dist/arm64/libnexuscore.dylib dist/amd64/libnexuscore.dylib
          lipo -info dist/libnexuscore.dylib
          nm -gU dist/arm64/libnexuscore.dylib | grep ' _nx_'

      # The macOS integration helper: menu bar status item, app menu, Dock
      # reopen and nexus:// URL events (desktop/uno/macos/native/NexusMac.m).
      # A small Objective-C library with a C ABI, called from C# through
      # LibraryImport; see the file header for why not objc_msgSend.
      - name: Build libnexusmac.dylib (arm64 + x86_64, universal)
        run: |
          set -euo pipefail
          clang -arch arm64 -arch x86_64 -mmacosx-version-min=12.0 -fobjc-arc -Wall -Wextra -Wno-unused-parameter             -dynamiclib -framework AppKit -framework CoreServices             -install_name @rpath/libnexusmac.dylib -o dist/libnexusmac.dylib desktop/uno/macos/native/NexusMac.m
          lipo -info dist/libnexusmac.dylib
          nm -gU dist/libnexusmac.dylib | grep ' _nx_mac_'

      # Uno's own bundler lays the .app out the way codesign wants it (managed
      # assemblies outside Contents/MacOS) and signs it; CodesignKey=- is ad hoc.
      - name: Publish Nexus.app with Uno (osx-arm64, self-contained)
        working-directory: desktop/uno
        run: |
          set -euo pipefail
          dotnet publish Nexus.Uno.csproj -c Release -f net10.0-desktop -r osx-arm64 \
            --self-contained true -p:TargetFrameworks=net10.0-desktop -p:PackageFormat=app -p:CodesignKey=- \
            > "$GITHUB_WORKSPACE/dist/publish.log" 2>&1 || { tail -80 "$GITHUB_WORKSPACE/dist/publish.log"; exit 1; }
          grep -E 'warning NU|error|->' "$GITHUB_WORKSPACE/dist/publish.log" | tail -20 || true
          built=$(find bin/Release/net10.0-desktop/osx-arm64/publish -maxdepth 1 -name '*.app' | head -1)
          test -n "$built" || { echo "no .app produced"; find bin/Release -maxdepth 4 | head -50; exit 1; }
          rm -rf "$APP"; cp -R "$built" "$APP"
          echo "--- bundle layout"
          find "$APP" -maxdepth 3 | sed "s#$APP#Nexus.app#" | head -40
          find "$APP" -type f | wc -l

      - name: Info.plist, icon and the Go core
        run: |
          set -euo pipefail
          PL="$APP/Contents/Info.plist"
          echo "--- Uno's Info.plist"; plutil -p "$PL"
          short=$(sed -n 's:.*<ApplicationDisplayVersion>\(.*\)</ApplicationDisplayVersion>.*:\1:p' desktop/uno/Nexus.Uno.csproj)
          sed -e "s/__SHORT_VERSION__/${short}/" -e "s/__BUILD_VERSION__/${GITHUB_RUN_NUMBER}/"             desktop/uno/macos/Info.plist > "$RUNNER_TEMP/nexus.plist"
          # Our keys win over Uno's defaults, except the executable name Uno chose.
          exe=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$PL")
          for key in CFBundleIdentifier CFBundleName CFBundleDisplayName CFBundleShortVersionString CFBundleVersion                      LSMinimumSystemVersion LSApplicationCategoryType NSHighResolutionCapable                      NSDocumentsFolderUsageDescription NSDesktopFolderUsageDescription NSDownloadsFolderUsageDescription CFBundleURLTypes; do
            /usr/libexec/PlistBuddy -c "Delete :$key" "$PL" 2>/dev/null || true
          done
          /usr/libexec/PlistBuddy -c "Merge $RUNNER_TEMP/nexus.plist" "$PL"
          /usr/libexec/PlistBuddy -c "Set :CFBundleExecutable $exe" "$PL"
          plutil -lint "$PL"; plutil -p "$PL"
          # The Dock icon: Uno's packager names it icon.icns (from Resizetizer).
          icon=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIconFile' "$PL")
          test -f "$APP/Contents/Resources/${icon%.icns}.icns" || { echo "CFBundleIconFile $icon is missing"; exit 1; }
          ls "$APP/Contents/Resources" | grep -i icns || echo "no .icns in Resources"
          # The core goes where the other native libraries (SkiaSharp) are,
          # which is where [LibraryImport("nexuscore")] probes.
          skia=$(find "$APP" -name 'libSkiaSharp.dylib' | head -1)
          dest=$(dirname "$skia")
          cp dist/libnexuscore.dylib "$dest/libnexuscore.dylib"
          cp dist/libnexusmac.dylib "$dest/libnexusmac.dylib"
          echo "core and mac helper -> ${dest#$APP/}"
          du -sh "$APP"

      - name: Ad-hoc codesign
        run: |
          set -euo pipefail
          for lib in libnexuscore.dylib libnexusmac.dylib; do
            codesign --force --sign - --timestamp=none "$(find "$APP" -name $lib)"
          done
          # The outer signature seals Info.plist and the new library.
          codesign --force --sign - --timestamp=none "$APP"
          codesign --verify --strict --verbose=2 "$APP"
          codesign -dv "$APP" 2>&1 | grep -E 'Identifier|Signature|Format|Info.plist'

      - name: Build the window probe
        run: swiftc -O -o dist/winlist scripts/macos/winlist.swift

      # So LaunchServices knows this bundle handles nexus:// (Info.plist
      # CFBundleURLTypes); an installed app is registered when first opened.
      - name: Register the bundle with LaunchServices
        run: |
          /System/Library/Frameworks/CoreServices.framework/Frameworks/LaunchServices.framework/Support/lsregister -f "$APP"
          /System/Library/Frameworks/CoreServices.framework/Frameworks/LaunchServices.framework/Support/lsregister -dump             | grep -B2 -A2 'nexus:' | head -20 || true

      # Two launches in isolated profiles with no server and no credentials:
      # a fresh one (first-run setup guide), then one seeded past setup (the
      # main shell). Each waits for a window, captures the screen and the
      # window alone, and records whether the app was still alive.
      - name: Launch, wait for the window, screenshot
        timeout-minutes: 8
        run: |
          set -uo pipefail
          mkdir -p shots logs
          EXE="$APP/Contents/MacOS/$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Contents/Info.plist")"
          screencapture -x shots/00-desktop-before.png || true
          ok=1
          run_case() {
            local name=$1 seeded=$2
            local root="$RUNNER_TEMP/nexus-profile-$name"
            rm -rf "$root"
            if [ "$seeded" = 1 ]; then
              mkdir -p "$root/AppData/Local/Nexus"
              printf '{ "SetupCompleted": true, "LastNav": "timeline", "Theme": "dark" }\n' > "$root/AppData/Local/Nexus/ui-prefs.json"
            fi
            env -u NEXUS_SERVER -u CENTRAL_SERVER_URL -u NEXUS_TOKEN -u CENTRAL_MEMORY_TOKEN \
              NEXUS_PROFILE="$name" NEXUS_PROFILE_ROOT="$root" \
              "$EXE" > "logs/$name-stdout.log" 2>&1 &
            local pid=$! seen=0 alive=0 out wins wid
            echo "== $name pid=$pid"
            for i in $(seq 1 45); do
              sleep 2
              if ! kill -0 $pid 2>/dev/null; then echo "$name exited early"; break; fi
              out=$(./dist/winlist $pid 2>/dev/null || echo 0)
              # Normal windows only (layer 0); the menu bar item is a window too.
              wins=$(echo "$out" | tail -n +2 | awk '$6==0' | wc -l | tr -d ' ')
              if [ "${wins:-0}" -gt 0 ] 2>/dev/null; then seen=1; echo "t=$((i*2))s"; echo "$out"; break; fi
            done
            sleep 15
            screencapture -x "shots/$name-screen.png" || echo "screencapture failed"
            wid=$(./dist/winlist $pid 2>/dev/null | tail -n +2 | awk '$6==0' | sort -k5 -n -r | head -1 | cut -d' ' -f1)
            if [ -n "$wid" ]; then screencapture -x -o -l "$wid" "shots/$name-window.png" || true; fi
            sleep 10
            screencapture -x "shots/$name-screen-later.png" || true
            kill -0 $pid 2>/dev/null && alive=1
            echo "$name: window_seen=$seen alive=$alive"
            kill $pid 2>/dev/null; sleep 3; kill -9 $pid 2>/dev/null || true
            echo "--- $name stdout/stderr (tail)"; tail -60 "logs/$name-stdout.log" || true
            mkdir -p "logs/$name"
            find "$root" -maxdepth 6 -name '*.log' -exec cp {} "logs/$name/" \; 2>/dev/null || true
            find "$root" -maxdepth 6 -path '*reports*' -type f -exec cp {} "logs/$name/" \; 2>/dev/null || true
            [ $seen = 1 ] && [ $alive = 1 ] || ok=0
          }
          run_case ci-mac-fresh 0
          run_case ci-mac-shell 1
          ls -la shots logs
          for f in ~/Library/Logs/DiagnosticReports/*; do case "$f" in *Nexus*) cp "$f" logs/ ;; esac; done 2>/dev/null || true
          test $ok = 1

      # The macOS system integration against one running instance: menu bar
      # item, app menu, close-hides and Dock reopen, nexus:// via LaunchServices,
      # second-launch hand-off, and the start-at-login LaunchAgent.
      - name: System integration checks
        timeout-minutes: 12
        run: bash scripts/macos/uno-integration-checks.sh

      - name: Zip the app
        if: ${{ !cancelled() }}
        run: |
          test -d "$APP" && ditto -c -k --keepParent "$APP" dist/Nexus-macos-arm64-adhoc.zip && ls -la dist/*.zip || true

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: nexus-macos-app
          path: dist/Nexus-macos-arm64-adhoc.zip
          if-no-files-found: warn
          retention-days: 7

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: nexus-macos-screenshots
          path: |
            shots/
            logs/
            dist/publish.log
          if-no-files-found: warn
          retention-days: 14
