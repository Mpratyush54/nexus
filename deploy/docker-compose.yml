# Local production-shape verification for issue #20.
#
# Postgres 16 + pgvector (matches Aurora Serverless v2 engine), server boots
# and migrates on launch, daemon registers against it. Secrets here are
# dev-only placeholders — production values come from Secrets Manager
# (infra/terraform/secrets.tf) and are never committed.
#
# Usage:
#   docker compose -f deploy/docker-compose.yml up --build
#   curl localhost:8080/healthz            # {"status":"ok",...}
#   curl localhost:8080/readyz             # {"ok":true,"migrations_applied":N}
#   curl localhost:7687/healthz
#
# Acceptance mapping (issue #20):
#   Aurora+pgvector  -> pgvector/pgvector:pg16 image (same major + extension)
#   container boots  -> server/daemon services with healthchecks
#     + migrates     -> server runs migrations/*.up.sql before ListenAndServe

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: central_memory
      POSTGRES_USER: central
      POSTGRES_PASSWORD: central-dev-only
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U central -d central_memory"]
      interval: 5s
      timeout: 3s
      retries: 20

  server:
    build:
      context: ..
      dockerfile: Dockerfile.server
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: central_memory
      DB_USER: central
      DB_PASSWORD: central-dev-only
      DB_SSLMODE: disable
      JWT_SECRET: dev-only-jwt-secret-at-least-32-chars-long
      PORT: 8080
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  daemon:
    build:
      context: ..
      dockerfile: Dockerfile.daemon
    environment:
      CENTRAL_SERVER_URL: http://server:8080
      DAEMON_ADDR: :7687
      # Token file lives OUTSIDE the read-only workspace mount (issue #45):
      # the daemon mints/loads .central-memory/daemon.token under the
      # workspace root, which :ro below cannot write. /tmp is writable and
      # ephemeral per container boot (fresh token each `up`; acceptable for
      # the demo shape — production mounts a persistent state volume here).
      DAEMON_TOKEN_FILE: /tmp/daemon.token
    ports:
      - "7687:7687"
    volumes:
      # Demo mount: point at any checkout to exercise sandboxed file/git ops.
      - ../:/workspace:ro
    depends_on:
      server:
        condition: service_started

volumes:
  pgdata:
