  </style>
  <div id="root" data-composition-id="captions" data-width="1920" data-height="1080">

    <div id="cap-steps" class="cap top clip" data-start="19.7" data-duration="5.6">Watch every <em>step</em> it takes.</div>

    <div id="cap-capture" class="cap top clip" data-start="25.8" data-duration="3.5">Every session, <em>captured.</em></div>
    <div id="cap-search" class="cap top clip" data-start="29.5" data-duration="3.4">Every agent. Every <em>project.</em></div>

    <div id="cap-memory" class="cap top clip" data-start="33.3" data-duration="4.4">One memory <em>every agent</em> can query.</div>
    <div id="cap-stale" class="cap top clip" data-start="37.9" data-duration="3.1">A <em>brief</em> every agent reads first.</div>

  </div>
  <script>
    (function () {
      const root = document.querySelector('[data-composition-id="captions"]');
      const caps = Array.from(root.querySelectorAll(".cap"));
      // Split each caption into word spans (keeps <em> colour on its words).
      caps.forEach((cap) => {
        const parts = [];
        cap.childNodes.forEach((n) => {
          const isEm = n.nodeType === 1 && n.tagName === "EM";
          (n.textContent || "").split(/(\s+)/).forEach((tok) => {
            if (!tok) return;
            if (/^\s+$/.test(tok)) parts.push(" ");
            else parts.push(isEm ? '<em class="w">' + tok + "</em>" : '<span class="w">' + tok + "</span>");
          });
        });
        cap.innerHTML = parts.join("");
      });

      const tl = gsap.timeline({ paused: true });
      caps.forEach((cap) => {
        const s = parseFloat(cap.dataset.start);
        const d = parseFloat(cap.dataset.duration);
        const words = cap.querySelectorAll(".w");
        tl.fromTo(
          words,
          { y: 46, opacity: 0, filter: "blur(12px)" },
          { y: 0, opacity: 1, filter: "blur(0px)", duration: 0.5, ease: "power3.out", stagger: 0.07 },
          s,
        );
        tl.to(
          words,
          { y: -24, opacity: 0, filter: "blur(8px)", duration: 0.28, ease: "power2.in", stagger: 0.025 },
          s + d - 0.36,
        );
      });
      window.__timelines["captions"] = tl;
    })();
  </script>
</template>
