name: Release Windows Desktop

# Builds Nexus Desktop (tray) + daemon + CLI for Windows, publishes GitHub
# Release assets, syncs to S3, and writes desktop/latest.json for auto-update.

on:
  push:
    tags:
      - 'desktop-v*'
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: Version label (e.g. 0.2.0) — defaults to tag or short SHA
        required: false

permissions:
  id-token: write
  contents: write

env:
  AWS_REGION: ap-south-1
  ROLE_TO_ASSUME: arn:aws:iam::833291393451:role/GitHubActions-CentralMemory-Deploy
  API_URL: https://api-nexus.pratyushes.dev
  RELEASES_BUCKET: central-memory-releases

jobs:
  build-windows:
    name: Build Windows amd64
    runs-on: windows-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'

      - name: Resolve version
        id: meta
        shell: bash
        run: |
          VER="${{ github.event.inputs.version }}"
          if [ -z "$VER" ]; then
            if [[ "${{ github.ref }}" == refs/tags/* ]]; then
              VER="${GITHUB_REF_NAME}"
              VER="${VER#desktop-}"
            else
              VER="0.0.0-${GITHUB_SHA:0:7}"
            fi
          fi
          VER="${VER#v}"
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Build Windows binaries
        shell: bash
        env:
          VER: ${{ steps.meta.outputs.version }}
          BUILT_AT: ${{ steps.meta.outputs.built_at }}
        run: |
          mkdir -p dist
          LD_COMMON="-s -w -X central-memory/internal/buildinfo.Version=${VER} -X central-memory/internal/buildinfo.Commit=${GITHUB_SHA} -X central-memory/internal/buildinfo.BuiltAt=${BUILT_AT} -X main.defaultServerURL=${API_URL}"
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath \
            -ldflags "${LD_COMMON} -H windowsgui" \
            -o dist/nexus-desktop-windows-amd64.exe ./cmd/nexus-desktop
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath \
            -ldflags "${LD_COMMON}" \
            -o dist/nexus-daemon-windows-amd64.exe ./cmd/daemon
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath \
            -ldflags "${LD_COMMON}" \
            -o dist/nexus-windows-amd64.exe ./cmd/nexus
          cp scripts/install-windows.ps1 dist/install-windows.ps1
          (cd dist && sha256sum *.exe install-windows.ps1 > SHA256SUMS.txt) || \
            (cd dist && shasum -a 256 *.exe install-windows.ps1 > SHA256SUMS.txt)
          ls -la dist

      - name: Write latest.json manifest
        shell: bash
        env:
          VER: ${{ steps.meta.outputs.version }}
        run: |
          BASE="https://${RELEASES_BUCKET}.s3.${AWS_REGION}.amazonaws.com/desktop/${VER}"
          cat > dist/latest.json <<EOF
          {
            "app": "desktop",
            "version": "${VER}",
            "channel": "stable",
            "os": "windows",
            "arch": "amd64",
            "published_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "commit": "${GITHUB_SHA}",
            "install_url": "${BASE}/install-windows.ps1",
            "artifacts": [
              {"name": "nexus-desktop", "filename": "nexus-desktop-windows-amd64.exe", "url": "${BASE}/nexus-desktop-windows-amd64.exe"},
              {"name": "nexus-daemon", "filename": "nexus-daemon-windows-amd64.exe", "url": "${BASE}/nexus-daemon-windows-amd64.exe"},
              {"name": "nexus", "filename": "nexus-windows-amd64.exe", "url": "${BASE}/nexus-windows-amd64.exe"}
            ]
          }
          EOF

      - uses: actions/upload-artifact@v4
        with:
          name: nexus-windows-desktop
          path: dist/
          if-no-files-found: error

  publish:
    needs: build-windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: nexus-windows-desktop
          path: dist

      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-v${{ needs.build-windows.outputs.version }}
          name: Nexus Desktop ${{ needs.build-windows.outputs.version }}
          generate_release_notes: true
          files: |
            dist/nexus-desktop-windows-amd64.exe
            dist/nexus-daemon-windows-amd64.exe
            dist/nexus-windows-amd64.exe
            dist/install-windows.ps1
            dist/SHA256SUMS.txt
            dist/latest.json

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Sync to S3 (versioned + latest pointer)
        env:
          VER: ${{ needs.build-windows.outputs.version }}
        run: |
          BUCKET="${{ vars.RELEASES_S3_BUCKET }}"
          if [ -z "$BUCKET" ]; then BUCKET="${RELEASES_BUCKET}"; fi
          aws s3 sync dist "s3://${BUCKET}/desktop/${VER}/" \
            --exclude "*" \
            --include "nexus-*-windows-amd64.exe" \
            --include "install-windows.ps1" \
            --include "SHA256SUMS.txt" \
            --include "latest.json"
          aws s3 sync dist "s3://${BUCKET}/cli/${VER}/" \
            --exclude "*" \
            --include "nexus-*-windows-amd64.exe" \
            --include "install-windows.ps1" \
            --include "SHA256SUMS.txt"
          aws s3 cp dist/latest.json "s3://${BUCKET}/desktop/latest.json" \
            --cache-control "no-cache, max-age=60" \
            --content-type application/json
          aws s3 cp dist/install-windows.ps1 "s3://${BUCKET}/desktop/latest/install-windows.ps1" \
            --cache-control "no-cache, max-age=60"
          echo "Desktop release: s3://${BUCKET}/desktop/${VER}/"
          echo "Latest pointer:  s3://${BUCKET}/desktop/latest.json"
