<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <meta name="description" content="Nexus is a native desktop app and cloud server that gives Claude Code, Codex, Cursor, OpenCode, Gemini and Kimi one shared memory and one chat. Agents keep working in the background, ask before they act, and every change can be reviewed or undone." />
    <link rel="canonical" href="https://nexus.pratyushes.dev/" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta name="theme-color" content="#f4f5f2" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0e100f" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/x-icon" href="/brand/nexus.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/pwa-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Nexus" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Nexus" />
    <meta property="og:url" content="https://nexus.pratyushes.dev/" />
    <meta property="og:title" content="Nexus: shared memory for every AI coding agent" />
    <meta property="og:description" content="Chat with Claude Code, Codex, Cursor, OpenCode, Gemini and Kimi in one native app. Agents keep working while you do something else, and every change can be reviewed or undone. One shared project memory for all of them." />
    <meta property="og:image" content="https://nexus.pratyushes.dev/og/nexus-og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Nexus: one memory for every coding agent. Claude Code, Codex, Cursor, OpenCode, Gemini, Kimi." />
    <meta property="og:locale" content="en_US" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Nexus: shared memory for every AI coding agent" />
    <meta name="twitter:description" content="Chat with Claude Code, Codex, Cursor, OpenCode, Gemini and Kimi in one native app. Agents keep working while you do something else, and every change can be reviewed or undone. One shared project memory for all of them." />
    <meta name="twitter:image" content="https://nexus.pratyushes.dev/og/nexus-og.png" />
    <meta name="twitter:image:alt" content="Nexus: one memory for every coding agent." />

    <script>
      (function () {
        var d = document.documentElement, home = location.pathname === '/'
        d.classList.add(home ? 'nx-home' : 'nx-app')
        // The landing page is dark only (src/landing/site.css); the web app keeps its own theme choice.
        if (home) {
          // Feature tabs stack their panels only with JS (src/landing/site.css, .nx-js).
          d.classList.add('nx-js')
          document.querySelectorAll('meta[name="theme-color"]').forEach(function (m) { m.content = '#0c0e0d' })
          return
        }
        var t = null
        try { t = localStorage.getItem('nexus.theme') } catch (e) {}
        // Same rule as src/lib/theme.ts, applied before first paint to avoid a flash.
        if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'
        d.dataset.theme = t
        document.querySelectorAll('meta[name="theme-color"]').forEach(function (m) { m.content = t === 'light' ? '#f7f6f3' : '#0a0a0a' })
      })()
    </script>
    <style>
      /* Boot splash for app routes, drawn before any script (src/lib/boot-splash.ts removes it). Mirrors .au-boot in src/auth/auth.css. */
      #nx-boot { position: fixed; inset: 0; z-index: 99; display: grid; place-items: center; align-content: center; gap: 18px; background: #0e100f; transition: opacity .25s ease; }
      html[data-theme='light'] #nx-boot { background: #f4f5f2; }
      html.nx-home #nx-boot { display: none; }
      /* The landing is dark only: paint the dark background before its stylesheet loads. */
      html.nx-home { background: #0c0e0d; color-scheme: dark; }
      #nx-boot b { display: block; width: 96px; height: 2px; border-radius: 2px; background: #2a2d2b; overflow: hidden; }
      html[data-theme='light'] #nx-boot b { background: #d9dbd5; }
      #nx-boot b i { display: block; width: 40%; height: 100%; border-radius: 2px; background: #e8bb67; }
      @media (prefers-reduced-motion: no-preference) { #nx-boot b i { animation: nx-boot-slide 1.1s cubic-bezier(.22,1,.36,1) infinite; } }
      @keyframes nx-boot-slide { from { transform: translateX(-110%); } to { transform: translateX(260%); } }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="nx-boot" role="status" aria-label="Loading Nexus"><svg viewBox="0 0 64 64" width="44" height="44" fill="none" aria-hidden="true"><rect width="64" height="64" rx="15" fill="#171918"/><g transform="translate(5 5) scale(.84375)"><path d="M14 47V20a6 6 0 0 1 6-6h5l25 33" stroke="#F4F1E9" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><path d="M50 17v27a6 6 0 0 1-6 6h-5L14 17" stroke="#E8BB67" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><path d="m25 32 8 10" stroke="#F4F1E9" stroke-width="8" stroke-linecap="round"/></g></svg><b><i></i></b></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
