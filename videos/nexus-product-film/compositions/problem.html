  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });
      const cards = ["#pb-c1", "#pb-c2", "#pb-c3", "#pb-c4"];
      const chips = ["#pb-f1", "#pb-f2", "#pb-f3", "#pb-f4", "#pb-f5", "#pb-f6"];
      // Cards pop in one per half-bar.
      cards.forEach((c, i) => {
        if (i === 0) return; // first card is already on screen at frame 0
        tl.fromTo(c, { opacity: 0, scale: 0.86, y: 30 }, { opacity: 1, scale: 1, y: 0, duration: 0.42, ease: "back.out(1.7)" }, 0.55 + i * 0.9);
      });
      chips.forEach((c, i) => {
        tl.fromTo(c, { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 4.7 + i * 0.16);
      });
      // Slow drift apart while the context stays scattered.
      const drift = [[-60, -30], [60, -24], [-50, 40], [56, 36]];
      cards.forEach((c, i) => {
        tl.to(c, { x: drift[i][0], y: drift[i][1], rotation: (i % 2 ? 1.5 : -1.5), duration: 4.4, ease: "sine.inOut" }, 4.6);
      });
      const cdrift = [[-30, 20], [30, -20], [20, -30], [-20, 30], [-40, 10], [40, 10]];
      chips.forEach((c, i) => {
        tl.to(c, { x: cdrift[i][0], y: cdrift[i][1], duration: 4.0, ease: "sine.inOut" }, 5.2);
      });
      // A brief glitch jolt on the cards.
      tl.to(cards.join(","), { x: "+=14", duration: 0.05, yoyo: true, repeat: 3, ease: "none" }, 5.2);
      // Everything is pulled into one point.
      const all = cards.concat(chips);
      all.forEach((c, i) => {
        const el = document.querySelector(c);
        const isCard = el.classList.contains("card");
        const r = { x: parseFloat(el.style.left) + (isCard ? 280 : 90), y: parseFloat(el.style.top) + (isCard ? 80 : 24) };
        tl.to(c, { x: 960 - r.x, y: 540 - r.y, scale: 0.05, opacity: 0, filter: "blur(10px)", rotation: 0, duration: 0.7, ease: "power3.in" }, 9.35 + (i % 4) * 0.04);
      });
      tl.fromTo("#pb-core", { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.24, ease: "back.out(3)" }, 9.95);
      tl.to("#pb-core", { scale: 2.2, duration: 0.25, ease: "power2.in" }, 10.2);
      window.__timelines["problem"] = tl;
