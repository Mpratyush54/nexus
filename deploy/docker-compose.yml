# Local production-shape verification for issue #20 (+ deploy fixes #45/#126).
#
# Postgres 16 + pgvector (matches Aurora Serverless v2 engine), server boots
# and migrates on launch, daemon registers against it. Secrets here are
# dev-only placeholders — production values come from Secrets Manager
# (infra/terraform/secrets.tf) and are never committed.
#
# Env contract (single source of truth: deploy/secrets-notes.md):
#   server: DATABASE_URL primary (dev value below, sslmode=disable) with
#     CENTRAL_MEMORY_LOCAL_DEV=1 bypassing the require gate (/readyz +
#     migrate.sh enforce sslmode=require otherwise). JWT key is JWT_SECRET
#     (CENTRAL_MEMORY_JWT_KEY still accepted as legacy fallback).
#   daemon: CENTRAL_SERVER_URL + CENTRAL_USER_ID (required for Register);
#     single port 7687; container serves the /workspace mount (read-write:
#     the daemon mints .central-memory/daemon.token on first boot, so :ro
#     breaks token mint per #45).
#
# Usage:
#   docker compose -f deploy/docker-compose.yml up --build
#   curl localhost:8080/healthz            # {"ok":true,...}
#   curl localhost:8080/readyz             # {"ok":true,...} (local-dev bypass)
#   docker compose -f deploy/docker-compose.yml build   # CI smoke (no daemon up)
#
# Daemon binds 0.0.0.0 in containers (see command below), so the mapped
# 7687 is reachable from the host. Register/heartbeat (daemon -> server,
# outbound) work either way.

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: central_memory
      POSTGRES_USER: central
      POSTGRES_PASSWORD: central-dev-only
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U central -d central_memory"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  server:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.server
    environment:
      DATABASE_URL: postgres://central:central-dev-only@postgres:5432/central_memory?sslmode=disable
      CENTRAL_MEMORY_LOCAL_DEV: 1
      JWT_SECRET: dev-only-jwt-secret-at-least-32-chars-long
      PORT: 8080
      MIGRATIONS_DIR: /migrations
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/healthz | grep -q '\"ok\":true'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  daemon:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.daemon
    command: ["-root", "/workspace", "-port", "7687", "-bind", "0.0.0.0"]
    environment:
      CENTRAL_SERVER_URL: http://server:8080
      CENTRAL_USER_ID: compose-dev-user
    ports:
      - "7687:7687"
    volumes:
      # Read-write on purpose: first boot mints .central-memory/daemon.token
      # (#45). Demo mount: point at any checkout to exercise file/git ops.
      - ../:/workspace:rw
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:7687/heartbeat || test $? -eq 8"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

volumes:
  pgdata:
