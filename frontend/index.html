    <script>
      (function () {
        var d = document.documentElement, home = location.pathname === '/'
        d.classList.add(home ? 'nx-home' : 'nx-app')
        // The landing page and the web app keep separate theme choices.
        var t = null
        try { t = localStorage.getItem(home ? 'nx-theme' : 'nexus.theme') } catch (e) {}
        if (home) {
          if (t === 'light' || t === 'dark') d.dataset.theme = t
          return
        }
        // Same rule as src/lib/theme.ts, applied before first paint to avoid a flash.
        if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'
        d.dataset.theme = t
        document.querySelectorAll('meta[name="theme-color"]').forEach(function (m) { m.content = t === 'light' ? '#f7f6f3' : '#0a0a0a' })
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
