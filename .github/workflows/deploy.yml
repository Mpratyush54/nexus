name: Deploy to Amazon ECR & ECS

on:
  push:
    branches:
      - master

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-south-1
  ROLE_TO_ASSUME: arn:aws:iam::833291393451:role/GitHubActions-CentralMemory-Deploy
  ECR_REPOSITORY: central-memory-server

jobs:
  build-and-push:
    name: Build & Push Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Server Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./deploy/Dockerfile.server
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-frontend:
    name: Build & Deploy PWA
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install & build
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Upload PWA artifact
        uses: actions/upload-artifact@v4
        with:
          name: nexus-pwa-${{ github.sha }}
          path: frontend/dist
          retention-days: 14

      - name: Configure AWS Credentials (OIDC)
        if: ${{ vars.FRONTEND_S3_BUCKET != '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Sync to S3 / CloudFront
        if: ${{ vars.FRONTEND_S3_BUCKET != '' }}
        env:
          BUCKET: ${{ vars.FRONTEND_S3_BUCKET }}
          DISTRIBUTION: ${{ vars.FRONTEND_CLOUDFRONT_ID }}
        run: |
          aws s3 sync frontend/dist "s3://${BUCKET}" --delete \
            --cache-control "public,max-age=31536000,immutable" \
            --exclude "index.html" --exclude "sw.js" --exclude "manifest.webmanifest"
          aws s3 cp frontend/dist/index.html "s3://${BUCKET}/index.html" \
            --cache-control "public,max-age=60" --content-type "text/html"
          aws s3 cp frontend/dist/sw.js "s3://${BUCKET}/sw.js" \
            --cache-control "public,max-age=60" --content-type "application/javascript"
          aws s3 cp frontend/dist/manifest.webmanifest "s3://${BUCKET}/manifest.webmanifest" \
            --cache-control "public,max-age=60" --content-type "application/manifest+json"
          if [ -n "${DISTRIBUTION}" ]; then
            aws cloudfront create-invalidation --distribution-id "${DISTRIBUTION}" --paths "/*"
          fi
